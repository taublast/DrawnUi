  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    Two-texture shader effect driven by a 0..1 <xref href="DrawnUi.Draw.ShaderTransitionEffect.Progress" data-throw-if-not-resolved="false"></xref>, for slide transitions

    (<xref href="DrawnUi.Controls.SkiaShaderCarousel" data-throw-if-not-resolved="false"></xref>). The shader receives the usual

    <xref href="DrawnUi.Draw.ShaderDoubleTexturesEffect" data-throw-if-not-resolved="false"></xref> inputs (<code>iImage1</code> = from, <code>iImage2</code> = to) plus

    <code>progress</code> and <code>ratio</code> (width / height) uniforms. Without an explicit

    <xref href="DrawnUi.Draw.SkiaShaderEffect.ShaderTemplate" data-throw-if-not-resolved="false"></xref> the embedded gl-transitions adapter template is used, so any

    transition from https://github.com/gl-transitions/gl-transitions ported to SkSL

    (a <code>transition(vec2 uv)</code> function using <code>getFromColor</code>/<code>getToColor</code>) works as <xref href="DrawnUi.Draw.SkiaShaderEffect.ShaderSource" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public class ShaderTransitionEffect : ShaderDoubleTexturesEffect, INotifyPropertyChanged, IDisposable, IPostRendererEffect, ISkiaEffect, ICanBeUpdatedWithContext, ICanBeUpdated, IComparable, IComparable<SkiaShaderEffect>, IEquatable<SkiaShaderEffect>'
