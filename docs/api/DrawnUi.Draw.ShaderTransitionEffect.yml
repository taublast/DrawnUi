- uid: DrawnUi.Draw.ShaderTransitionEffect.DefaultTemplate
  commentId: F:DrawnUi.Draw.ShaderTransitionEffect.DefaultTemplate
  id: DefaultTemplate
  parent: DrawnUi.Draw.ShaderTransitionEffect
  langs:
  - csharp
  - vb
  name: DefaultTemplate
  nameWithType: ShaderTransitionEffect.DefaultTemplate
  fullName: DrawnUi.Draw.ShaderTransitionEffect.DefaultTemplate
  type: Field
  source:
    remote:
      path: src/Shared/DrawnUi/Features/Effects/ShaderTransitionEffect.cs
      branch: Cells
      repo: https://github.com/DrawnUi/DrawnUi.Net.git
    id: DefaultTemplate
    path: ../src/Shared/DrawnUi/Features/Effects/ShaderTransitionEffect.cs
    startLine: 17
  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    gl-transitions adapter: declares the uniforms and <code>getFromColor</code>/<code>getToColor</code> sampling

    with the GLSL bottom-left to SkSL top-left Y flip. The transition source replaces <code>//script-goes-here</code>.
  example: []
  syntax:
    content: public const string DefaultTemplate = "\nuniform float ratio; // width / height\nuniform float progress; // 0.0 - 1.0\nuniform shader iImage1; // Texture\nuniform shader iImage2; // Texture for backside\nuniform float2 iOffset; // Top-left corner of DrawingRect\nuniform float2 iResolution; // Viewport resolution (pixels)\nuniform float2 iImageResolution; // iImage1 resolution (pixels)\nuniform float  iTime; // Shader playback time (s)\nuniform float4 iMouse; // Mouse drag pos=.xy Click pos=.zw (pixels)\n\n//In GLSL, the texture coordinate origin is at the bottom-left corner,\n//whereas in SKSL the origin is at the top-left corner.\n\nvec4 getFromColor(vec2 uv) {\n    vec2 adjustedUV = float2(uv.x, 1.0 - uv.y) * iImageResolution;\n    return iImage1.eval(adjustedUV);\n}\n\nvec4 getToColor(vec2 uv) {\n    vec2 adjustedUV = float2(uv.x, 1.0 - uv.y) * iImageResolution;\n    return iImage2.eval(adjustedUV);\n}\n\n//script-goes-here\n"
    return:
      type: System.String
    content.vb: Public Const DefaultTemplate As String = vbLf & "uniform float ratio; // width / height" & vbLf & "uniform float progress; // 0.0 - 1.0" & vbLf & "uniform shader iImage1; // Texture" & vbLf & "uniform shader iImage2; // Texture for backside" & vbLf & "uniform float2 iOffset; // Top-left corner of DrawingRect" & vbLf & "uniform float2 iResolution; // Viewport resolution (pixels)" & vbLf & "uniform float2 iImageResolution; // iImage1 resolution (pixels)" & vbLf & "uniform float  iTime; // Shader playback time (s)" & vbLf & "uniform float4 iMouse; // Mouse drag pos=.xy Click pos=.zw (pixels)" & vbLf & vbLf & "//In GLSL, the texture coordinate origin is at the bottom-left corner," & vbLf & "//whereas in SKSL the origin is at the top-left corner." & vbLf & vbLf & "vec4 getFromColor(vec2 uv) {" & vbLf & "    vec2 adjustedUV = float2(uv.x, 1.0 - uv.y) * iImageResolution;" & vbLf & "    return iImage1.eval(adjustedUV);" & vbLf & "}" & vbLf & vbLf & "vec4 getToColor(vec2 uv) {" & vbLf & "    vec2 adjustedUV = float2(uv.x, 1.0 - uv.y) * iImageResolution;" & vbLf & "    return iImage2.eval(adjustedUV);" & vbLf & "}" & vbLf & vbLf & "//script-goes-here" & vbLf
