  assemblies:
  - DrawnUi.Maui
  namespace: DrawnUi.Draw
  summary: >-
    A texture together with WHERE it sits, in canvas pixels. The two halves are inseparable:

    a cache surface is recorded over <xref href="DrawnUi.Draw.CachedObject.Bounds" data-throw-if-not-resolved="false"></xref>, which can be inflated

    beyond the control box by effects/shadow margins, and <xref href="DrawnUi.Draw.SkiaImage" data-throw-if-not-resolved="false"></xref> hands over

    its rescaled source, rasterized at DISPLAY size — neither starts at DrawingRect. Consumers

    that sample the texture by screen coordinates (post-renderer effects) get it wrong unless

    the origin travels with the image.
  example: []
