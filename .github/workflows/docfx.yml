name: Build Docs + Blazor Samples + Publish

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Rebuild Blazor WASM samples (uncheck for docs-only: reuses the samples cached by the last full run)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-artifact-id: ${{ steps.upload-pages-artifact.outputs.artifact_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Install DocFX
        run: dotnet tool install --global docfx

      - name: Build DocFX site
        shell: pwsh
        run: |
          Set-Location ./docs
          if (Test-Path ./_site) {
              Remove-Item ./_site -Recurse -Force
          }
          if (Test-Path ./api) {
            Get-ChildItem ./api -Filter *.yml -File | Remove-Item -Force
          }
          docfx metadata ./docfx.json
          docfx build ./docfx.json

      - name: Restore cached WASM samples
        uses: actions/cache@v4
        with:
          path: ./docs/_site/sandbox
          key: wasm-samples-${{ github.run_id }}
          restore-keys: wasm-samples-

      - name: Decide whether to build samples
        id: samples
        shell: pwsh
        run: |
          $build = '${{ inputs.samples }}' -eq 'true'
          if (-not $build -and -not (Test-Path ./docs/_site/sandbox/index.html)) {
            Write-Host "No cached samples available, building them anyway so the published site keeps /sandbox/."
            $build = $true
          }
          "build=$($build.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install WASM workload
        if: steps.samples.outputs.build == 'true'
        run: sudo dotnet workload install wasm-tools

      - name: Publish WASM samples
        if: steps.samples.outputs.build == 'true'
        shell: pwsh
        run: ./dev/publish-wasm-samples.ps1

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/_site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    needs:
      - build
      - deploy
    if: ${{ needs.build.outputs.pages-artifact-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.pages-artifact-id }}
        run: gh api -X DELETE "/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
